version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: api_hexagonal
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    restart: on-failure 
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:123@db:5432/api_hexagonal?sslmode=disable
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db

volumes:
  postgres_data: